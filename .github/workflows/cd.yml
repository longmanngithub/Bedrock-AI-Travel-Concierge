name: CD (deploy to DigitalOcean)

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      vars.DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy the validated revision over SSH
        shell: bash
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          SSH_HOST: ${{ secrets.DROPLET_HOST }}
          SSH_USER: ${{ secrets.DROPLET_USER }}
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          SSH_PORT: ${{ secrets.DROPLET_SSH_PORT || '22' }}
          SSH_KNOWN_HOSTS: ${{ secrets.DROPLET_SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          if [[ -z "$SSH_HOST" || -z "$SSH_USER" || -z "$SSH_KEY" ]]; then
            echo "::warning::Deployment credentials are missing. Skipping deploy."
            exit 0
          fi
          if [[ -z "$SSH_KNOWN_HOSTS" ]]; then
            echo "::error::Set DROPLET_SSH_KNOWN_HOSTS to the verified server host key."
            exit 1
          fi
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.:][a-zA-Z0-9.:-]*$ ]]
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          [[ "$SSH_PORT" =~ ^[0-9]{1,5}$ ]]
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          printf '%s\n' "$SSH_KEY" > "$ssh_dir/key"
          encoded_path=$(printf '%s' "${DEPLOY_PATH:-ai-agent}" | base64 -w 0)
          ssh -p "$SSH_PORT" -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -- "$SSH_USER@$SSH_HOST" "bash -s -- $DEPLOY_SHA $encoded_path" <<'REMOTE'
          set -euo pipefail
          sha="$1"
          deploy_path=$(printf '%s' "$2" | base64 -d)
          if [[ "$deploy_path" == "~/"* ]]; then deploy_path="$HOME/${deploy_path:2}"; fi
          cd "$deploy_path"
          git fetch origin main
          if [[ "$(git rev-parse FETCH_HEAD)" != "$sha" ]]; then
            echo "A newer revision reached main. Skipping stale deployment."
            exit 0
          fi
          if ! git status --porcelain --untracked-files=no | diff -q /dev/null -; then
            echo "Deployment checkout contains tracked changes."
            exit 1
          fi
          git checkout --detach "$sha"
          docker compose -f docker-compose.prod.yml up -d --build --wait
          REMOTE
