name: CI

# Run backend regression tests and verify that the frontend and both container images build.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements.lock

      - name: Audit Python runtime dependencies
        # These four Chroma advisories apply to its HTTP server and RBAC.
        # The application uses embedded storage and does not run that server.
        run: |
          python -m venv "$RUNNER_TEMP/bedrock-pip-audit"
          "$RUNNER_TEMP/bedrock-pip-audit/bin/pip" install pip-audit==2.10.1
          site_packages=$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          "$RUNNER_TEMP/bedrock-pip-audit/bin/pip-audit" --path "$site_packages" \
            --ignore-vuln PYSEC-2026-311 --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 --ignore-vuln PYSEC-2026-3815

      - name: Byte-compile (catches syntax errors)
        # evaluation/ is gitignored (not pushed to GitHub — see .gitignore),
        # so only the shipped `app` package is checked here.
        run: python -m compileall -q app

      - name: Backend regression tests
        env:
          CREWAI_DISABLE_TELEMETRY: "true"
          LITELLM_LOCAL_MODEL_COST_MAP: "True"
          OTEL_SDK_DISABLED: "true"
        run: python -m unittest discover -s tests

      - name: Import smoke test
        # No live DB/LLM key needed to import — Settings() falls back to
        # defaults and SQLAlchemy's create_engine() doesn't connect until
        # first use. This just proves the app wires together.
        run: python -c "import app.main"

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production npm dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build

  docker-build-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.service }} image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./${{ matrix.service }}
          push: false
          tags: concierge-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
