x-backend-env: &backend-env
  # Groq handles chat and evaluation. The crew uses Cloudflare for planning and review.
  MODEL: ${MODEL:-groq/openai/gpt-oss-120b}
  JUDGE_MODEL: ${JUDGE_MODEL:-groq/openai/gpt-oss-120b}
  TIER_CHEAP: ${TIER_CHEAP:-}
  TIER_STANDARD: ${TIER_STANDARD:-cloudflare/@cf/openai/gpt-oss-120b}
  TIER_QUALITY: ${TIER_QUALITY:-cloudflare/@cf/zai-org/glm-4.7-flash}
  TASK_TIERS: ${TASK_TIERS:-extraction=cheap,reply=cheap,answer=cheap,research=quality,planner=quality,reviewer=standard,judge=standard}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_API_KEY: ${CLOUDFLARE_API_KEY:-}
  GROQ_COMPACT_PLANNING: ${GROQ_COMPACT_PLANNING:-false}
  GROQ_REUSE_EXTRACTED_REPLY: ${GROQ_REUSE_EXTRACTED_REPLY:-false}
  CLOUDFLARE_CREW_MAX_RPM: ${CLOUDFLARE_CREW_MAX_RPM:-30}
  REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-120}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST:-localhost}:${POSTGRES_PORT:-5432}/${POSTGRES_DB}}

  REDIS_URL: ${REDIS_URL:-redis://${REDIS_USER:-default}:${REDIS_PASSWORD}@${REDIS_HOST:-localhost}:${REDIS_PORT:-6379}/${REDIS_DB_INDEX:-0}}
  QUEUE_REDIS_URL: ${QUEUE_REDIS_URL:-}

  # Auth & Security
  COOKIES_SECURE: ${COOKIES_SECURE:-true}
  FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
  RATE_LIMIT_GENERATE: ${RATE_LIMIT_GENERATE:-20/minute}

  # Notifications & Communications
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: "${EMAIL_FROM:-AI Travel Concierge <onboarding@resend.dev>}"
  OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-600}
  OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS:-60}
  OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}

  # External APIs
  TAVILY_API_KEY: ${TAVILY_API_KEY:-}
  GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
  TRAVELPAYOUTS_TOKEN: ${TRAVELPAYOUTS_TOKEN:-}
  TRAVELPAYOUTS_MARKER: ${TRAVELPAYOUTS_MARKER:-621166}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      <<: *backend-env
      PRODUCTION: "true"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (a long random string)}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      EMAIL_VERIFICATION_SECRET: ${EMAIL_VERIFICATION_SECRET:-}
      AVATAR_STORAGE_BACKEND: ${AVATAR_STORAGE_BACKEND:-local}
      AVATAR_LOCAL_DIR: /var/lib/bedrock/avatars
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    volumes:
      - concierge_avatars:/var/lib/bedrock/avatars
    expose:
      - "8000"
    networks:
      - app-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      <<: *backend-env
      ALEMBIC_SKIP: "1"
    command: ["arq", "app.queue.worker.WorkerSettings"]
    healthcheck:
      disable: true
    stop_grace_period: 60s
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?set NEXT_PUBLIC_API_URL in .env}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "5173"
    networks:
      - app-network

networks:
  app-network:
    name: ${DOCKER_NETWORK_NAME:-dokploy-network}
    external: true

volumes:
  concierge_avatars:
